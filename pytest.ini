[pytest]
testpaths = tests/generated
base_url = https://codemify.com
addopts = 
    -n auto
    --browser chromium
    --base-url https://codemify.com
    --headed
    --tracing on
    --html=reports/report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/report.json

# Live logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] (%(filename)s:%(lineno)s) - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
